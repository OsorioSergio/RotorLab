[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rotorlab-app"
version = "0.1.0"
description = "RotorLab frontend shell built with PyQt6"
requires-python = ">=3.11"
dependencies = [
  "PyQt6>=6.7,<7",
]

[project.scripts]
rotorlab-app = "rotorlab_app.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

